<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg width="718.33" height="944.00" xmlns="http://www.w3.org/2000/svg">
<rect width="718.33" height="944.00" fill="#1a1b26" x="0.00px" y="0.00px"/>
<g font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14.00px" fill="#c4c4c4" clip-path="url(#terminalMask)">
<text x="5.00px" y="21.80px" xml:space="preserve"><tspan xml:space="preserve">  roborev [command]</tspan></text><text x="5.00px" y="38.60px" xml:space="preserve"/><text x="5.00px" y="55.40px" xml:space="preserve"><tspan xml:space="preserve">Available Commands:</tspan></text><text x="5.00px" y="72.20px" xml:space="preserve"><tspan xml:space="preserve">  agent-hook        Install and run optional agent harness hooks for roborev</tspan></text><text x="5.00px" y="89.00px" xml:space="preserve"><tspan xml:space="preserve">  analyze           Run built-in analysis on files</tspan></text><text x="5.00px" y="105.80px" xml:space="preserve"><tspan xml:space="preserve">  backfill-tokens   Backfill token usage for completed jobs</tspan></text><text x="5.00px" y="122.60px" xml:space="preserve"><tspan xml:space="preserve">  cancel            Cancel a queued or running review job</tspan></text><text x="5.00px" y="139.40px" xml:space="preserve"><tspan xml:space="preserve">  check-agents      Check which agents are available and responding</tspan></text><text x="5.00px" y="156.20px" xml:space="preserve"><tspan xml:space="preserve">  ci                CI-specific commands for running roborev in CI pipelines</tspan></text><text x="5.00px" y="173.00px" xml:space="preserve"><tspan xml:space="preserve">  close             Close a review (mark as resolved)</tspan></text><text x="5.00px" y="189.80px" xml:space="preserve"><tspan xml:space="preserve">  comment           Add a comment to a review</tspan></text><text x="5.00px" y="206.60px" xml:space="preserve"><tspan xml:space="preserve">  compact           Verify and consolidate open review findings</tspan></text><text x="5.00px" y="223.40px" xml:space="preserve"><tspan xml:space="preserve">  completion        Generate the autocompletion script for the specified shell</tspan></text><text x="5.00px" y="240.20px" xml:space="preserve"><tspan xml:space="preserve">  config            Get and set roborev configuration</tspan></text><text x="5.00px" y="257.00px" xml:space="preserve"><tspan xml:space="preserve">  cost              Show approximate aggregate review cost for a repo or branch</tspan></text><text x="5.00px" y="273.80px" xml:space="preserve"><tspan xml:space="preserve">  daemon            Manage the roborev daemon</tspan></text><text x="5.00px" y="290.60px" xml:space="preserve"><tspan xml:space="preserve">  export            Export roborev data</tspan></text><text x="5.00px" y="307.40px" xml:space="preserve"><tspan xml:space="preserve">  fix               One-shot fix for review findings</tspan></text><text x="5.00px" y="324.20px" xml:space="preserve"><tspan xml:space="preserve">  help              Help about any command</tspan></text><text x="5.00px" y="341.00px" xml:space="preserve"><tspan xml:space="preserve">  init              Initialize roborev in current repository</tspan></text><text x="5.00px" y="357.80px" xml:space="preserve"><tspan xml:space="preserve">  insights          Analyze review patterns and suggest guideline improvements</tspan></text><text x="5.00px" y="374.60px" xml:space="preserve"><tspan xml:space="preserve">  install-hook      Install post-commit hook in current repository</tspan></text><text x="5.00px" y="391.40px" xml:space="preserve"><tspan xml:space="preserve">  list              List review jobs</tspan></text><text x="5.00px" y="408.20px" xml:space="preserve"><tspan xml:space="preserve">  log               Show agent output log for a job</tspan></text><text x="5.00px" y="425.00px" xml:space="preserve"><tspan xml:space="preserve">  pause             Pause queue processing</tspan></text><text x="5.00px" y="441.80px" xml:space="preserve"><tspan xml:space="preserve">  post-commit       Hook entry point: enqueue a review after commit</tspan></text><text x="5.00px" y="458.60px" xml:space="preserve"><tspan xml:space="preserve">  quickstart        Print an agent-oriented guide to setting up roborev in this repo</tspan></text><text x="5.00px" y="475.40px" xml:space="preserve"><tspan xml:space="preserve">  refine            Iterative review-fix loop until all reviews pass</tspan></text><text x="5.00px" y="492.20px" xml:space="preserve"><tspan xml:space="preserve">  repo              Manage repositories in the roborev database</tspan></text><text x="5.00px" y="509.00px" xml:space="preserve"><tspan xml:space="preserve">  respond           Alias for &apos;comment&apos; - add a comment to a review</tspan></text><text x="5.00px" y="525.80px" xml:space="preserve"><tspan xml:space="preserve">  review            Review a commit, commit range, or uncommitted changes</tspan></text><text x="5.00px" y="542.60px" xml:space="preserve"><tspan xml:space="preserve">  run               Execute a task with an AI agent</tspan></text><text x="5.00px" y="559.40px" xml:space="preserve"><tspan xml:space="preserve">  show              Show review for a commit or job</tspan></text><text x="5.00px" y="576.20px" xml:space="preserve"><tspan xml:space="preserve">  skills            Manage AI agent skills</tspan></text><text x="5.00px" y="593.00px" xml:space="preserve"><tspan xml:space="preserve">  snooze            Temporarily silence agent-hook reminders in this workspace</tspan></text><text x="5.00px" y="609.80px" xml:space="preserve"><tspan xml:space="preserve">  status            Show daemon, browser UI, and queue status</tspan></text><text x="5.00px" y="626.60px" xml:space="preserve"><tspan xml:space="preserve">  stream            Stream review events in real-time</tspan></text><text x="5.00px" y="643.40px" xml:space="preserve"><tspan xml:space="preserve">  summary           Show aggregate review statistics</tspan></text><text x="5.00px" y="660.20px" xml:space="preserve"><tspan xml:space="preserve">  sync              Manage PostgreSQL sync</tspan></text><text x="5.00px" y="677.00px" xml:space="preserve"><tspan xml:space="preserve">  tui               Interactive terminal UI for monitoring reviews</tspan></text><text x="5.00px" y="693.80px" xml:space="preserve"><tspan xml:space="preserve">  ui                Open the Roborev browser UI</tspan></text><text x="5.00px" y="710.60px" xml:space="preserve"><tspan xml:space="preserve">  uninstall-hook    Remove roborev hooks from current repository</tspan></text><text x="5.00px" y="727.40px" xml:space="preserve"><tspan xml:space="preserve">  unpause           Resume queue processing</tspan></text><text x="5.00px" y="744.20px" xml:space="preserve"><tspan xml:space="preserve">  update            Update roborev to the latest version</tspan></text><text x="5.00px" y="761.00px" xml:space="preserve"><tspan xml:space="preserve">  version           Show roborev version</tspan></text><text x="5.00px" y="777.80px" xml:space="preserve"><tspan xml:space="preserve">  wait              Wait for an existing review job to complete</tspan></text><text x="5.00px" y="794.60px" xml:space="preserve"/><text x="5.00px" y="811.40px" xml:space="preserve"><tspan xml:space="preserve">Flags:</tspan></text><text x="5.00px" y="828.20px" xml:space="preserve"><tspan xml:space="preserve">  -h, --help            help for roborev</tspan></text><text x="5.00px" y="845.00px" xml:space="preserve"><tspan xml:space="preserve">      --server string   daemon server address (e.g. 127.0.0.1:7373 or unix://)</tspan></text><text x="5.00px" y="861.80px" xml:space="preserve"><tspan xml:space="preserve">  -v, --verbose         verbose output</tspan></text><text x="5.00px" y="878.60px" xml:space="preserve"/><text x="5.00px" y="895.40px" xml:space="preserve"><tspan xml:space="preserve">Use &quot;roborev [command] --help&quot; for more information about a command.</tspan></text><text x="5.00px" y="912.20px" xml:space="preserve"><tspan xml:space="preserve">$</tspan></text>
</g>
</svg>
