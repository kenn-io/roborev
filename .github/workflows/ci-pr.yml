name: CI

# Use the PR's workflow so CI changes are tested before merging.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: read-all

jobs:
  run:
    uses: ./.github/workflows/ci.yml

  gate:
    name: CI gate
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require CI success
        env:
          RESULT: ${{ needs.run.result }}
        run: test "$RESULT" = success
