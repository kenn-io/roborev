name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct
  # Module-relative source paths keep build cache entries independent of the checkout path.
  GOFLAGS: -trimpath

jobs:
  go-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.go == 'true' }}
      lint: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.lint == 'true' }}
      web: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.web == 'true' }}
      docs: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Go changes
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            go:
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/ci.yml'
              - 'docs/screenshots/prepare-demo-db.sh'
              - '.custom-gcl.yml'
              - '.golangci.yml'
            lint:
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - '.custom-gcl.yml'
              - '.golangci.yml'
              - 'docs/**/*.md'
              - 'docs/zensical.toml'
              - 'docs/pyproject.toml'
              - 'docs/uv.lock'
              - 'docs/scripts/format_markdown.py'
              - 'docs/scripts/public_markdown_sources.py'
              - 'docs/scripts/test_format_markdown.py'
              - 'Makefile'
              - 'prek.toml'
              - '.github/workflows/ci.yml'
            web:
              - 'package.json'
              - 'bun.lock'
              - 'web/**'
              - 'packages/roborev-ui/**'
              - 'internal/web/**'
              - 'internal/daemon/browser_*.go'
              - 'pkg/client/openapi.yaml'
              - 'Makefile'
              - '.goreleaser.yaml'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  api:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated API contract
        run: make api-check

      - name: Verify checks leave the tree unchanged
        run: git diff --exit-code

  api-breaking:
    needs: go-changes
    if: github.event_name == 'pull_request' && needs.go-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Check for breaking API contract changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make api-breaking BASE_REF="origin/$BASE_REF"

  web:
    needs: go-changes
    if: needs.go-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.22.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated API contract
        run: make api-check

      - name: Check frontend
        run: bun run web:check

      - name: Test frontend packages
        run: bun run web:test

      - name: Install browser test runtime
        run: bun run --cwd web playwright install --with-deps chromium

      - name: Test embedded browser application
        run: bun run web:test:e2e

      - name: Validate embedded release assets
        run: make web-release-check

      # The first-paint check loads the pages the daemon serves, so it sees
      # the daemon's real headers, including its Content-Security-Policy.
      - name: Build the daemon for the first-paint check
        env:
          FIRST_PAINT_DIR: ${{ runner.temp }}/first-paint
        run: |
          mkdir -p "$FIRST_PAINT_DIR"
          trap 'make web-restore' EXIT
          make web-embed
          go build -o "$FIRST_PAINT_DIR/roborev" ./cmd/roborev

      - name: Start the daemon for the first-paint check
        env:
          FIRST_PAINT_DIR: ${{ runner.temp }}/first-paint
        run: |
          home="$FIRST_PAINT_DIR/home"
          mkdir -p "$FIRST_PAINT_DIR/data" "$home"
          go run ./internal/testutil/cmd/seed-web -out "$FIRST_PAINT_DIR/reviews.db"
          printf 'max_workers = 0\n\n[web]\nenabled = true\nlisten = "127.0.0.1:7380"\n' \
            > "$FIRST_PAINT_DIR/config.toml"
          HOME="$home" XDG_CACHE_HOME="$home/.cache" XDG_CONFIG_HOME="$home/.config" \
            ROBOREV_DATA_DIR="$FIRST_PAINT_DIR/data" ROBOREV_TELEMETRY_ENABLED=0 \
            "$FIRST_PAINT_DIR/roborev" daemon run --db "$FIRST_PAINT_DIR/reviews.db" \
            --config "$FIRST_PAINT_DIR/config.toml" --addr 127.0.0.1:0 \
            > "$FIRST_PAINT_DIR/daemon.log" 2>&1 &
          if ! curl --fail --silent --show-error --retry 30 --retry-delay 1 \
            --retry-all-errors http://127.0.0.1:7380/api/ping; then
            cat "$FIRST_PAINT_DIR/daemon.log"
            exit 1
          fi

      - name: Check first paint of the browser UI
        uses: kenn-io/actions/first-paint@ee1ddcce6a620e49ba96f613bb8d113e0193b4f6 # first-paint, kenn-io/actions#6
        with:
          urls: |
            http://127.0.0.1:7380/reviews
            http://127.0.0.1:7380/reviews/52
            http://127.0.0.1:7380/analytics

      - name: Verify checks leave the tree unchanged
        run: git diff --exit-code

  docs-first-paint:
    needs: go-changes
    if: needs.go-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: '0.13.4'
          enable-cache: true
          cache-dependency-glob: docs/uv.lock

      - name: Build the docs site
        run: |
          make docs-install
          make docs-build

      - name: Check first paint of the docs site
        uses: kenn-io/actions/first-paint@ee1ddcce6a620e49ba96f613bb8d113e0193b4f6 # first-paint, kenn-io/actions#6
        with:
          dist: docs/site

  test:
    needs: go-changes
    if: github.event_name == 'workflow_dispatch' || needs.go-changes.outputs.changed == 'true'
    name: test (${{ matrix.shard || matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-2025
            shard: windows-remaining
          - os: windows-latest
            runner: windows-2025
            shard: windows-daemon-a-f
            package: ./internal/daemon
            pattern: &daemon-a-f '^(Test([A-F]|[^A-Z]|$)|Example|Fuzz)'
          - os: windows-latest
            runner: windows-2025
            shard: windows-daemon-g-m-t-z
            package: ./internal/daemon
            pattern: &daemon-g-m-t-z '^Test[G-MT-Z]'
          - os: windows-latest
            runner: windows-2025
            shard: windows-daemon-n-s
            package: ./internal/daemon
            pattern: &daemon-n-s '^Test[N-S]'
          - os: windows-latest
            runner: windows-2025
            shard: windows-cli-a-m-t-z
            package: ./cmd/roborev
            pattern: '^(Test([A-MT-Z]|[^A-Z]|$)|Example|Fuzz)'
          - os: windows-latest
            runner: windows-2025
            shard: windows-cli-n-s
            package: ./cmd/roborev
            pattern: '^Test[N-S]'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SQLite headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Configure Windows Go paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in 'GOCACHE', 'GOMODCACHE', 'GOTMPDIR') {
            $path = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            "$name=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'

      # prepare-demo-db.sh tests run the uv pinned in mise.lock.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1

      - name: Build
        if: runner.os != 'Windows' || matrix.shard == 'windows-remaining'
        run: go build ./...

      - name: Test with race detection (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -o pipefail
          mkdir -p test-results
          # The daemon package is large enough to exceed Go's package timeout
          # under the race detector, so dedicated jobs shard it below.
          go list ./... |
            grep -v '^go\.kenn\.io/roborev/internal/daemon$' |
            xargs go test -json -timeout 30m -race -shuffle=on -tags integration 2>&1 |
            tee "test-results/${{ matrix.os }}-test.jsonl"

      - name: Test (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -o pipefail
          mkdir -p test-results
          # Go's race detector can intermittently hang/crash while spawning child
          # processes on darwin/arm64; Linux keeps the race coverage for CI.
          go test -json -timeout 30m -shuffle=on -tags integration ./... 2>&1 |
            tee "test-results/${{ matrix.os }}-test.jsonl"

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          $packages = @('${{ matrix.package }}')
          if (-not '${{ matrix.package }}') {
            $packages = go list -tags integration ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packages = @($packages | Where-Object { $_ -notin 'go.kenn.io/roborev/internal/daemon', 'go.kenn.io/roborev/cmd/roborev' })
          }
          $testArgs = @()
          if ('${{ matrix.pattern }}') { $testArgs = @('-run', '${{ matrix.pattern }}') }
          # go test on Windows can exit 1 due to temp .exe cleanup
          # ("go: remove ...\.exe: Access is denied") even when all
          # tests pass. Only suppress that specific pattern.
          $testResultPath = "test-results/${{ matrix.shard || matrix.os }}-test.jsonl"
          go test -json -timeout 30m -shuffle=on -tags integration @testArgs @packages > $testResultPath 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "go test failed; recent output:"
            Get-Content -Path $testResultPath -Tail 200

            $failed = Select-String -Path $testResultPath -Pattern '"Action":"fail"'
            if ($failed) {
              Write-Host "Tests failed:"
              $failed | Select-Object -First 50 | ForEach-Object { Write-Host $_.Line }
              exit 1
            }
            $cleanup = Select-String -Path $testResultPath -Pattern "go: remove .+\.exe: Access is denied"
            if (-not $cleanup) {
              Write-Host "go test failed with unknown error"
              exit $exitCode
            }
            Write-Host "All tests passed (ignoring temp .exe cleanup error)"
            exit 0
          }

      - name: Upload test JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.shard || matrix.os }}-test-json
          path: test-results/${{ matrix.shard || matrix.os }}-test.jsonl
          if-no-files-found: ignore

      - name: Build with CGO disabled
        if: runner.os != 'Windows' || matrix.shard == 'windows-remaining'
        run: go build ./...
        env:
          CGO_ENABLED: 0

  daemon-race:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    name: daemon race (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: a-f
            pattern: *daemon-a-f
          - name: g-m-t-z
            pattern: *daemon-g-m-t-z
          - name: n-s
            pattern: *daemon-n-s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Test daemon with race detection
        run: |
          set -o pipefail
          mkdir -p test-results
          go test -json -timeout 20m -race -shuffle=on -tags integration \
            -run '${{ matrix.shard.pattern }}' ./internal/daemon 2>&1 |
            tee "test-results/daemon-${{ matrix.shard.name }}.jsonl"

      - name: Upload test JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: daemon-${{ matrix.shard.name }}-test-json
          path: test-results/daemon-${{ matrix.shard.name }}.jsonl
          if-no-files-found: ignore

  coverage:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'

      # prepare-demo-db.sh tests run the uv pinned in mise.lock.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1

      - name: Test with coverage
        # Race coverage runs in the test and daemon-race jobs; repeating it here
        # makes the daemon package exceed its timeout without improving coverage.
        run: |
          set -o pipefail
          mkdir -p test-results
          go test -json -timeout 45m -shuffle=on -tags integration -coverprofile=coverage.out ./... 2>&1 |
            tee test-results/coverage.jsonl

      - name: Upload coverage test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-test-json
          path: test-results/coverage.jsonl
          if-no-files-found: ignore

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          file: coverage.out
        continue-on-error: true

  integration:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: roborev_test
          POSTGRES_PASSWORD: roborev_test_password
          POSTGRES_DB: roborev_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U roborev_test -d roborev_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Run integration tests
        run: make test-postgres-ci GOFLAGS=-shuffle=on
        env:
          TEST_POSTGRES_URL: postgres://roborev_test:roborev_test_password@localhost:5433/roborev_test

  lint:
    needs: go-changes
    if: needs.go-changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SQLite headers
        if: needs.go-changes.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: needs.go-changes.outputs.changed == 'true'
        with:
          go-version: '1.27.3'

      - name: Resolve pinned golangci-lint version
        if: needs.go-changes.outputs.changed == 'true'
        id: golangci
        run: echo "version=v$(make -s print-golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        if: needs.go-changes.outputs.changed == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

      # Reuse the custom binary the previous step built; the action would build a Windows binary here.
      - name: golangci-lint for Windows
        if: needs.go-changes.outputs.changed == 'true'
        env:
          GOOS: windows
        run: ./custom-gcl run ./...

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: '0.13.4'
          enable-cache: true
          cache-dependency-glob: docs/uv.lock

      - name: Install docs lint dependencies
        run: uv sync --project docs --frozen

      - name: Markdown format
        run: make markdown-ci
