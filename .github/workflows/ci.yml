name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GOTRACEBACK: all
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct
  # Module-relative source paths keep build cache entries independent of the checkout path.
  GOFLAGS: -trimpath

jobs:
  go-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.go == 'true' }}
      lint: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.lint == 'true' }}
      web: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Go changes
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: step-security/paths-filter@v4.0.3
        with:
          filters: |
            go:
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'docs/screenshots/prepare-demo-db.sh'
              - '.custom-gcl.yml'
              - '.golangci.yml'
            lint:
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - '.custom-gcl.yml'
              - '.golangci.yml'
              - 'docs/**/*.md'
              - 'docs/zensical.toml'
              - 'docs/pyproject.toml'
              - 'docs/uv.lock'
              - 'docs/scripts/format_markdown.py'
              - 'docs/scripts/public_markdown_sources.py'
              - 'docs/scripts/test_format_markdown.py'
              - 'Makefile'
              - 'prek.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            web:
              - 'package.json'
              - 'bun.lock'
              - 'web/**'
              - 'packages/roborev-ui/**'
              - 'internal/web/**'
              - 'internal/daemon/browser_*.go'
              - 'pkg/client/openapi.yaml'
              - 'Makefile'
              - '.goreleaser.yaml'
              - '.github/workflows/ci.yml'

  api:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4

      - name: Install SQLite headers
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'

      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: '1.4.4'

      - name: Install frontend dependencies
        run: kit-retry 3 5 bun install --frozen-lockfile

      - name: Verify generated API contract
        run: make api-check DOWNLOAD_RETRY="kit-retry 3 5"

      - name: Verify checks leave the tree unchanged
        run: git diff --exit-code

  api-breaking:
    needs: go-changes
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.go-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'

      - name: Check for breaking API contract changes
        env:
          BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: make api-breaking BASE_REF="$BASE_REF"

  web:
    needs: go-changes
    if: needs.go-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4

      - name: Install SQLite headers
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'

      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: '1.4.4'

      - name: Install frontend dependencies
        run: kit-retry 3 5 bun install --frozen-lockfile

      - name: Verify generated API contract
        run: make api-check DOWNLOAD_RETRY="kit-retry 3 5"

      - name: Check frontend
        run: bun run web:check

      - name: Test frontend packages
        run: bun run web:test

      - name: Upload Vitest web results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-web-attempt-${{ github.run_attempt }}
          path: web/test-results/vitest/web.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Vitest roborev-ui results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-roborev-ui-attempt-${{ github.run_attempt }}
          path: packages/roborev-ui/test-results/vitest/roborev-ui.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Install browser test runtime
        run: kit-retry 3 5 bun run --cwd web playwright install --with-deps chromium

      - name: Test embedded browser application
        run: bun run web:test:e2e

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-web-attempt-${{ github.run_attempt }}
          path: web/test-results/playwright/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Validate embedded release assets
        run: make web-release-check

      - name: Verify checks leave the tree unchanged
        run: git diff --exit-code

  test:
    needs: go-changes
    if: github.event_name == 'workflow_dispatch' || needs.go-changes.outputs.changed == 'true'
    name: test (${{ matrix.shard || matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: macos-latest
          - os: windows-latest
            runner: windows-2025
            shard: windows-remaining
          - os: windows-latest
            runner: windows-2025
            shard: windows-daemon-a-f
            package: ./internal/daemon
            pattern: &daemon-a-f '^(Test([A-F]|[^A-Z]|$)|Example|Fuzz)'
          - os: windows-latest
            runner: windows-2025
            shard: windows-daemon-g-m-t-z
            package: ./internal/daemon
            pattern: &daemon-g-m-t-z '^Test[G-MT-Z]'
          - os: windows-latest
            runner: windows-2025
            shard: windows-daemon-n-s
            package: ./internal/daemon
            pattern: &daemon-n-s '^Test[N-S]'
          - os: windows-latest
            runner: windows-2025
            shard: windows-cli-a-m-t-z
            package: ./cmd/roborev
            pattern: '^(Test([A-MT-Z]|[^A-Z]|$)|Example|Fuzz)'
          - os: windows-latest
            runner: windows-2025
            shard: windows-cli-n-s
            package: ./cmd/roborev
            pattern: '^Test[N-S]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4
        if: runner.os == 'Linux'

      - name: Install SQLite headers
        if: runner.os == 'Linux'
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Configure Windows Go paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in 'GOCACHE', 'GOMODCACHE', 'GOTMPDIR') {
            $path = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            "$name=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: ${{ runner.os }}

      # prepare-demo-db.sh tests run the uv pinned in mise.lock.
      - uses: jdx/mise-action@v5.2.5

      - name: Build
        if: runner.os != 'Windows' || matrix.shard == 'windows-remaining'
        run: go build ./...

      - name: Test with race detection (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          SUITE: ${{ matrix.shard || matrix.os }}
        run: |
          set -o pipefail
          # The daemon package is large enough to exceed Go's package timeout
          # under the race detector, so dedicated jobs shard it below.
          packages="$(go list ./... | grep -v '^go\.kenn\.io/roborev/internal/daemon$')"
          go tool gotestsum --format pkgname-and-test-fails --format-icons text \
            --jsonfile "gotestsum/$SUITE.json" \
            --rerun-fails=2 --rerun-fails-report "gotestsum/$SUITE-reruns.txt" \
            --packages "$packages" \
            -- -timeout 15m -race -shuffle=on -tags integration

      - name: Search mirror growth (Linux)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 12
        run: make test-search-mirror-growth

      - name: Test (macOS)
        if: matrix.os == 'macos-latest'
        env:
          ROBOREV_TEST_LAUNCHD: '1'
          SUITE: ${{ matrix.shard || matrix.os }}
        run: |
          # Go's race detector can intermittently hang/crash while spawning child
          # processes on darwin/arm64; Linux keeps the race coverage for CI.
          go tool gotestsum --format pkgname-and-test-fails --format-icons text \
            --jsonfile "gotestsum/$SUITE.json" \
            --rerun-fails=2 --rerun-fails-report "gotestsum/$SUITE-reruns.txt" \
            --packages "./..." \
            -- -timeout 15m -shuffle=on -tags integration

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          SUITE: ${{ matrix.shard || matrix.os }}
        run: |
          $packages = @('${{ matrix.package }}')
          if (-not '${{ matrix.package }}') {
            $packages = go list -tags integration ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packages = @($packages | Where-Object { $_ -notin 'go.kenn.io/roborev/internal/daemon', 'go.kenn.io/roborev/cmd/roborev' })
          }
          $testArgs = @()
          if ('${{ matrix.pattern }}') { $testArgs = @('-run', '${{ matrix.pattern }}') }
          $jsonFile = "gotestsum/$env:SUITE.json"
          # go test on Windows can exit 1 due to temp .exe cleanup
          # ("go: remove ...\.exe: Access is denied") even when all
          # tests pass. Keep a copy of the output to recognize only that error.
          $outputFile = "gotestsum/$env:SUITE-output.log"
          New-Item -ItemType Directory -Force -Path gotestsum | Out-Null
          go tool gotestsum --format pkgname-and-test-fails --format-icons text `
            --jsonfile $jsonFile `
            --rerun-fails=2 --rerun-fails-report "gotestsum/$env:SUITE-reruns.txt" `
            --packages ($packages -join ' ') `
            -- -timeout 15m -shuffle=on -tags integration @testArgs 2>&1 |
            Tee-Object -FilePath $outputFile
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            # A rerun can pass a test that failed first, so judge each test
            # and package by its last result.
            $results = @{}
            Select-String -Path $jsonFile -Pattern '"Action":"(pass|fail|skip)"' | ForEach-Object {
              $event = $_.Line | ConvertFrom-Json
              $results["$($event.Package) $($event.Test)"] = $event
            }
            $failed = @($results.Values | Where-Object { $_.Action -eq 'fail' })
            if ($failed.Count -gt 0) {
              Write-Host "Tests failed:"
              $failed | Select-Object -First 50 | ForEach-Object { Write-Host "$($_.Package) $($_.Test)" }
              exit 1
            }
            $cleanup = Select-String -Path $outputFile -Pattern "go: remove .+\.exe: Access is denied"
            if (-not $cleanup) {
              Write-Host "go test failed with unknown error"
              exit $exitCode
            }
            Write-Host "All tests passed (ignoring temp .exe cleanup error)"
            exit 0
          }

      - name: Upload test JSON
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.shard || matrix.os }}-test-json
          path: gotestsum/${{ matrix.shard || matrix.os }}.json
          if-no-files-found: ignore

      - name: Upload gotestsum results
        if: failure() || github.run_attempt > 1 || hashFiles(format('gotestsum/{0}-reruns.txt', matrix.shard || matrix.os)) != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-${{ matrix.shard || matrix.os }}-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Build with CGO disabled
        if: runner.os != 'Windows' || matrix.shard == 'windows-remaining'
        run: go build ./...
        env:
          CGO_ENABLED: 0

      - name: Save Go caches
        if: ${{ !cancelled() && (runner.os != 'Windows' || matrix.shard == 'windows-remaining') }}
        uses: $/.github/actions/go-cache-save

  daemon-race:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    name: daemon race (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: a-f
            pattern: *daemon-a-f
          - name: g-m-t-z
            pattern: *daemon-g-m-t-z
          - name: n-s
            pattern: *daemon-n-s
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4

      - name: Install SQLite headers
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: Linux

      - name: Test daemon with race detection
        env:
          SUITE: daemon-${{ matrix.shard.name }}
        run: |
          go tool gotestsum --format pkgname-and-test-fails --format-icons text \
            --jsonfile "gotestsum/$SUITE.json" \
            --rerun-fails=2 --rerun-fails-report "gotestsum/$SUITE-reruns.txt" \
            --packages "./internal/daemon" \
            -- -timeout 10m -race -shuffle=on -tags integration \
            -run '${{ matrix.shard.pattern }}'

      - name: Upload test JSON
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: daemon-${{ matrix.shard.name }}-test-json
          path: gotestsum/daemon-${{ matrix.shard.name }}.json
          if-no-files-found: ignore

      - name: Upload gotestsum results
        if: failure() || github.run_attempt > 1 || hashFiles(format('gotestsum/daemon-{0}-reruns.txt', matrix.shard.name)) != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-daemon-${{ matrix.shard.name }}-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

  coverage:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4

      - name: Install SQLite headers
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: Linux

      # prepare-demo-db.sh tests run the uv pinned in mise.lock.
      - uses: jdx/mise-action@v5.2.5

      - name: Test with coverage
        # Race coverage runs in the test and daemon-race jobs; repeating it here
        # makes the daemon package exceed its timeout without improving coverage.
        # No reruns here: a rerun would rewrite coverage.out with only the
        # rerun's coverage.
        run: |
          go tool gotestsum --format pkgname-and-test-fails --format-icons text \
            --jsonfile gotestsum/coverage.json \
            --packages "./..." \
            -- -timeout 10m -shuffle=on -tags integration -coverprofile=coverage.out

      - name: Upload coverage test timings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-test-json
          path: gotestsum/coverage.json
          if-no-files-found: ignore

      - name: Upload gotestsum results
        if: failure() || github.run_attempt > 1
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-coverage-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage
        uses: step-security/codecov-action@v7.1.1
        with:
          file: coverage.out
        continue-on-error: true

  integration:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: roborev_test
          POSTGRES_PASSWORD: roborev_test_password
          POSTGRES_DB: roborev_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U roborev_test -d roborev_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4

      - name: Install SQLite headers
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: Linux

      - name: Run integration tests
        run: make test-postgres-ci GOFLAGS=-shuffle=on
        env:
          TEST_POSTGRES_URL: postgres://roborev_test:roborev_test_password@localhost:5433/roborev_test

      # test-postgres-ci runs two suites; give each its own artifact.
      - name: Upload gotestsum storage results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/postgres-storage-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-storage-attempt-${{ github.run_attempt }}
          path: gotestsum/postgres-storage.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload gotestsum daemon results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/postgres-daemon-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-daemon-attempt-${{ github.run_attempt }}
          path: gotestsum/postgres-daemon.json
          retention-days: 14
          if-no-files-found: ignore

  lint:
    needs: go-changes
    if: needs.go-changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.4

      - name: Install SQLite headers
        if: needs.go-changes.outputs.changed == 'true'
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: actions/setup-go@v7.0.0
        id: setup_go
        if: needs.go-changes.outputs.changed == 'true'
        with:
          go-version: '1.27.3'

      - name: Resolve pinned golangci-lint version
        if: needs.go-changes.outputs.changed == 'true'
        id: golangci
        run: echo "version=v$(make -s print-golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: Restore linter cache
        if: needs.go-changes.outputs.changed == 'true'
        uses: $/.github/actions/go-cache-restore
        with:
          group: lint-${{ steps.golangci.outputs.version }}-${{ hashFiles('.custom-gcl.yml') }}-${{ steps.setup_go.outputs.go-version }}
          path: |
            ${{ github.workspace }}/custom-gcl
            ~/.cache/golangci-lint

      # Build only on a cache miss; the key validates the custom binary.
      - name: Build custom linter
        if: needs.go-changes.outputs.changed == 'true' && hashFiles('custom-gcl') == ''
        uses: step-security/golangci-lint-action@v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}
          install-only: true
          skip-cache: true

      - name: golangci-lint
        if: needs.go-changes.outputs.changed == 'true'
        run: |
          ./custom-gcl config verify
          ./custom-gcl run ./...

      # Reuse the restored or freshly built custom binary for Windows analysis.
      - name: golangci-lint for Windows
        if: needs.go-changes.outputs.changed == 'true'
        env:
          GOOS: windows
        run: ./custom-gcl run ./...

      - name: Save linter cache
        if: needs.go-changes.outputs.changed == 'true'
        uses: $/.github/actions/go-cache-save

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: docs/uv.lock

      - name: Install docs lint dependencies
        run: kit-retry 3 5 uv sync --project docs --frozen

      - name: Markdown format
        run: make markdown-ci
