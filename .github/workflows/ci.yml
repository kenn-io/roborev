name: CI

on:
  workflow_call:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  go-changes:
    runs-on: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.go }}
      lint: ${{ steps.filter.outputs.lint }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Go changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            go:
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
            lint:
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'docs/**/*.md'
              - 'docs/zensical.toml'
              - 'docs/pyproject.toml'
              - 'docs/uv.lock'
              - 'docs/scripts/format_markdown.py'
              - 'docs/scripts/public_markdown_sources.py'
              - 'docs/scripts/test_format_markdown.py'
              - 'Makefile'
              - 'prek.toml'
              - '.github/workflows/ci.yml'
            web:
              - 'package.json'
              - 'bun.lock'
              - 'web/**'
              - 'packages/roborev-ui/**'
              - 'internal/web/**'
              - 'internal/daemon/browser_*.go'
              - 'pkg/client/openapi.yaml'
              - 'Makefile'
              - '.goreleaser.yaml'
              - '.github/workflows/ci.yml'

  api:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.27.0'
          cache: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated API contract
        run: make api-check

      - name: Verify checks leave the tree unchanged
        run: git diff --exit-code

  api-breaking:
    needs: go-changes
    if: github.event_name == 'pull_request' && needs.go-changes.outputs.changed == 'true'
    runs-on: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.27.0'
          cache: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Check for breaking API contract changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make api-breaking BASE_REF="origin/$BASE_REF"

  web:
    needs: go-changes
    if: needs.go-changes.outputs.web == 'true'
    runs-on: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.27.0'
          cache: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated API contract
        run: make api-check

      - name: Check frontend
        run: bun run web:check

      - name: Test frontend packages
        run: bun run web:test

      - name: Install browser test runtime
        run: bun run --cwd web playwright install --with-deps chromium

      - name: Test embedded browser application
        run: bun run web:test:e2e

      - name: Validate embedded release assets
        run: make web-release-check

      - name: Verify checks leave the tree unchanged
        run: git diff --exit-code

  test:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ contains(fromJSON('["ubuntu-latest","ubuntu-24.04","ubuntu-22.04"]'), matrix.os) && github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.0'
          cache: ${{ contains(fromJSON('["ubuntu-latest","ubuntu-24.04","ubuntu-22.04"]'), matrix.os) && github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Build
        run: go build ./...

      - name: Test with race detection (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -o pipefail
          mkdir -p test-results
          # The daemon package is large enough to exceed Go's package timeout
          # under the race detector, so dedicated jobs shard it below.
          go list ./... |
            grep -v '^go\.kenn\.io/roborev/internal/daemon$' |
            xargs go test -json -timeout 30m -race -shuffle=on -tags integration 2>&1 |
            tee "test-results/${{ matrix.os }}-test.jsonl"

      - name: Test (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -o pipefail
          mkdir -p test-results
          # Go's race detector can intermittently hang/crash while spawning child
          # processes on darwin/arm64; Linux keeps the race coverage for CI.
          go test -json -timeout 30m -shuffle=on -tags integration ./... 2>&1 |
            tee "test-results/${{ matrix.os }}-test.jsonl"

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          # go test on Windows can exit 1 due to temp .exe cleanup
          # ("go: remove ...\.exe: Access is denied") even when all
          # tests pass. Only suppress that specific pattern.
          $testResultPath = "test-results/${{ matrix.os }}-test.jsonl"
          go test -json -timeout 30m -shuffle=on -tags integration ./... > $testResultPath 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "go test failed; recent output:"
            Get-Content -Path $testResultPath -Tail 200

            $failed = Select-String -Path $testResultPath -Pattern '"Action":"fail"'
            if ($failed) {
              Write-Host "Tests failed:"
              $failed | Select-Object -First 50 | ForEach-Object { Write-Host $_.Line }
              exit 1
            }
            $cleanup = Select-String -Path $testResultPath -Pattern "go: remove .+\.exe: Access is denied"
            if (-not $cleanup) {
              Write-Host "go test failed with unknown error"
              exit $exitCode
            }
            Write-Host "All tests passed (ignoring temp .exe cleanup error)"
            exit 0
          }

      - name: Upload test JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.os }}-test-json
          path: test-results/${{ matrix.os }}-test.jsonl
          if-no-files-found: ignore

      - name: Build with CGO disabled
        run: go build ./...
        env:
          CGO_ENABLED: 0

  daemon-race:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    name: daemon race (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: a-f
            pattern: '^Test[A-F]'
          - name: g-m-t-z
            pattern: '^Test[G-MT-Z]'
          - name: n-s
            pattern: '^Test[N-S]'
    runs-on: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.27.0'
          cache: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Test daemon with race detection
        run: |
          set -o pipefail
          mkdir -p test-results
          go test -json -timeout 20m -race -shuffle=on -tags integration \
            -run '${{ matrix.shard.pattern }}' ./internal/daemon 2>&1 |
            tee "test-results/daemon-${{ matrix.shard.name }}.jsonl"

      - name: Upload test JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: daemon-${{ matrix.shard.name }}-test-json
          path: test-results/daemon-${{ matrix.shard.name }}.jsonl
          if-no-files-found: ignore

  coverage:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.0'
          cache: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Test with coverage
        # Race coverage runs in the test and daemon-race jobs; repeating it here
        # makes the daemon package exceed its timeout without improving coverage.
        run: go test -timeout 45m -shuffle=on -tags integration -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          file: coverage.out
        continue-on-error: true

  integration:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: roborev_test
          POSTGRES_PASSWORD: roborev_test_password
          POSTGRES_DB: roborev_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U roborev_test -d roborev_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.0'
          cache: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Run integration tests
        run: go test -shuffle=on -tags=postgres -v ./internal/storage/... -run Integration
        env:
          TEST_POSTGRES_URL: postgres://roborev_test:roborev_test_password@localhost:5433/roborev_test

  lint:
    needs: go-changes
    if: needs.go-changes.outputs.lint == 'true'
    runs-on: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: needs.go-changes.outputs.changed == 'true'
        with:
          go-version: '1.27.0'
          cache: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'false' || 'true' }}

      - name: Resolve pinned golangci-lint version
        if: needs.go-changes.outputs.changed == 'true'
        id: golangci
        run: echo "version=v$(make -s print-golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        if: needs.go-changes.outputs.changed == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: docs/uv.lock

      - name: Install docs lint dependencies
        run: uv sync --project docs --frozen

      - name: Markdown format
        run: make markdown-ci

  nix:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: ${{ github.repository == 'kenn-io/roborev' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check

      - name: Build package
        run: nix build

      - name: Verify binaries
        run: ./result/bin/roborev version

      - name: Verify nix apps
        run: nix run .#roborev -- version
