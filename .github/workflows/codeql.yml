name: CodeQL

on:
  workflow_call:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'

env:
  CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/codeql.yml:analyze
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 11
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go
        if: matrix.language == 'go'
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:${{ matrix.language }}
