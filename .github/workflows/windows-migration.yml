name: Windows Migration

# Verify safe Windows daemon migration from v0.56 to the current version.
on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

# ref_name (not ref) so workflow_dispatch, push, and pull_request runs on the
# same branch share one group: a dispatched run must be cancelled when a push
# supersedes it, and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  go-changes:
    runs-on: namespace-profile-linux-4cpu
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Go changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            go:
              - '*.go'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - '.github/workflows/windows-migration.yml'

  windows-migration-202608:
    needs: go-changes
    if: needs.go-changes.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure Windows Go paths
        shell: pwsh
        run: |
          foreach ($name in 'GOCACHE', 'GOMODCACHE', 'GOTMPDIR') {
            $path = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            "$name=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Download v0.56 Windows release binary
        id: old
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "roborev_0.56.0_windows_amd64.tar.gz"
          $extractDir = Join-Path $env:RUNNER_TEMP "roborev-v0.56.0"
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/kenn-io/roborev/releases/download/v0.56.0/roborev_0.56.0_windows_amd64.tar.gz" `
            -OutFile $archive
          tar -xzf $archive -C $extractDir
          "old_binary=$extractDir\roborev.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify v0.56 replacement safety
        shell: pwsh
        env:
          ROBOREV_MIGRATION_OLD_BINARY: ${{ steps.old.outputs.old_binary }}
        run: go test -timeout 10m -tags "integration migration" ./cmd/roborev -run TestWindowsV056DaemonMigrationRefusesUnsafeReplacement -count=1 -v
