name: Windows Migration

# Same-repository PRs run candidate migration checks; fork PRs use the main-pinned workflow.
on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/windows-migration.yml

  fork:
    if: github.event.pull_request.head.repo.full_name != github.repository
    uses: kenn-io/roborev/.github/workflows/windows-migration.yml@main
