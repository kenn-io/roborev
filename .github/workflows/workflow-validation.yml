name: Workflow validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Makefile"

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Check workflow download retries
        run: |
          GOFLAGS="${GOFLAGS:+$GOFLAGS }-n" kit-retry 3 5 make lint-workflow-retries
          make lint-workflow-retries
      - uses: step-security/jactionlint@v2.2.0
        with:
          version: 2.3.0
          profile: correctness
          online: "false"
          args: --shellcheck= --pyflakes=
          working-directory: ${{ github.workspace }}

  # The organization requires SHA-pinned actions. actions.lock pins every
  # action, including ones that other actions call, so a stale lockfile fails
  # jobs at setup.
  actions-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Verify the workflow action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: kit-retry 3 5 make gh-actions-lock-install && make actions-lock-check
