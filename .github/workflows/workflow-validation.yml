name: Workflow validation

on:
  push:
    branches: ['pr/**']
    paths:
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  branch-ci:
    if: github.event_name == 'push' && github.repository == 'kenn-io/roborev'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          shellcheck: false
          pyflakes: false
