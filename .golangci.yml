version: "2"
run:
  tests: true
  go: "1.27"
  build-tags:
    - postgres
linters:
  default: none
  enable:
    - errcheck
    - depguard
    - errorlint
    - forbidigo
    - govet
    - ineffassign
    - modernize
    - staticcheck
    - testifylint
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^\(uuid\.UUID\)\.String$'
          msg: keep uuid.UUID until a foreign text boundary; name that boundary in the nolint comment
        - pattern: '^uuid\.Parse$'
          msg: keep uuid.UUID until a foreign text boundary; name that boundary in the nolint comment
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/google/uuid
              desc: use Go 1.27's uuid package
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - modernize
        text: "omitzero:"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go.kenn.io/roborev)
    gofumpt:
      # extra-rules collapses same-type params (a, b string); keep them explicit.
      extra-rules: false
