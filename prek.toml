minimum_prek_version = "0.3.6"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "git-test-isolation"
name = "git test isolation"
language = "system"
entry = "make test-git-isolation"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
language = "system"
entry = "make lint-ci"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "markdown-format"
name = "markdown format"
language = "system"
entry = "make markdown-ci"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "renovate-config-validator"
name = "renovate config validator"
language = "system"
entry = "make check-renovate-config"
files = "^renovate\\.json$"
pass_filenames = false

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "make check-actions"
files = "^\\.github/workflows/.*\\.ya?ml$"
pass_filenames = false

[[repos.hooks]]
id = "web-check"
name = "web check"
language = "system"
entry = "bun run web:check"
files = "^(package\\.json|bun\\.lock|web/|packages/roborev-ui/)"
pass_filenames = false

[[repos.hooks]]
id = "web-test"
name = "web test"
language = "system"
entry = "bun run web:test"
files = "^(package\\.json|bun\\.lock|web/|packages/roborev-ui/)"
pass_filenames = false
