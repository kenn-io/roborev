overlay: 1.0.0
info:
  title: Preserve raw review JSON
  version: 1.0.0
actions:
  - target: '$.components.schemas.MigrateReviewInputBody.properties.document'
    update:
      x-go-type: jsontext.Value
      x-go-type-import:
        path: encoding/json/jsontext
  - target: '$.components.schemas.ImportLegacyReviewInputBody.properties.document'
    update:
      x-go-type: jsontext.Value
      x-go-type-import:
        path: encoding/json/jsontext
  - target: '$.components.schemas.LegacyReviewSource.properties.document'
    update:
      x-go-type: jsontext.Value
      x-go-type-import:
        path: encoding/json/jsontext
  # Unknown is a required null value, not an omitted historical verdict.
  - target: '$.components.schemas.LegacyReviewDocument.properties.legacy.properties.recorded_verdict'
    update:
      x-omitempty: false
  # A finding without a location carries location: null. The member is
  # always present, but null is valid, so validation must not require a value.
  - target: '$.components.schemas.StructuredReviewFinding.properties.location'
    update:
      x-oapi-codegen-extra-tags:
        validate: '-'
  # Kata publication metadata contains values of several JSON types.
  - target: '$.components.schemas.KataIssue.properties.metadata'
    update:
      x-go-type: jsontext.Value
      x-go-type-import:
        path: encoding/json/jsontext
