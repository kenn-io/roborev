<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none">
  <style>
    .box { fill: #1a1a1a; stroke: #00ff9f; stroke-width: 2; }
    .box-db { fill: #0d3331; stroke: #00ff9f; stroke-width: 2; }
    .label { fill: #00ff9f; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-anchor: middle; }
    .label-sm { fill: #888; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-anchor: middle; }
    .label-loop { fill: #00ff9f; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-anchor: middle; }
    .arrow { stroke: #00ff9f; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .loop { stroke: #00ff9f; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff9f" />
    </marker>
  </defs>

  <!-- 1. write code -->
  <rect x="20" y="78" width="168" height="92" rx="4" class="box" />
  <text x="104" y="119" class="label">write code</text>
  <text x="104" y="141" class="label-sm">you + agent</text>

  <path d="M 188 124 L 216 124" class="arrow" />

  <!-- 2. git commit -->
  <rect x="218" y="78" width="168" height="92" rx="4" class="box" />
  <text x="302" y="119" class="label">git commit</text>
  <text x="302" y="141" class="label-sm">post-commit hook</text>

  <path d="M 386 124 L 414 124" class="arrow" />

  <!-- 3. roborev reviews in background -->
  <rect x="416" y="78" width="168" height="92" rx="4" class="box" />
  <text x="500" y="113" class="label">roborev reviews</text>
  <text x="500" y="133" class="label-sm">in background</text>
  <text x="500" y="151" class="label-sm">codex, claude, gemini ...</text>

  <path d="M 584 124 L 612 124" class="arrow" />

  <!-- 4. findings -->
  <rect x="614" y="78" width="168" height="92" rx="4" class="box" />
  <text x="698" y="119" class="label">findings</text>
  <text x="698" y="141" class="label-sm">bugs / risks / nits</text>

  <path d="M 782 124 L 810 124" class="arrow" />

  <!-- 5. agent hook -->
  <rect x="812" y="78" width="168" height="92" rx="4" class="box" />
  <text x="896" y="119" class="label">agent hook</text>
  <text x="896" y="141" class="label-sm">nudges your agent</text>

  <path d="M 980 124 L 1008 124" class="arrow" />

  <!-- 6. /roborev-fix -->
  <rect x="1010" y="78" width="168" height="92" rx="4" class="box" />
  <text x="1094" y="119" class="label">/roborev-fix</text>
  <text x="1094" y="141" class="label-sm">applies the fix</text>

  <!-- loop back to write code -->
  <path d="M 1094 170 L 1094 270 Q 1094 290 1074 290 L 124 290 Q 104 290 104 270 L 104 174" class="loop" />
  <text x="599" y="283" class="label-loop">loop until reviews pass</text>
</svg>
